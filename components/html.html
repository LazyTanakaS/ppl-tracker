<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPL Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --surface2: #1a1a1a;
        --border: #222222;
        --accent-push: #ff4d00;
        --accent-pull: #00c2ff;
        --accent-legs: #00e87a;
        --text: #f0f0f0;
        --text-muted: #555;
        --text-dim: #888;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
        min-height: 100vh;
        padding: 24px 16px 60px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }

      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 48px;
        letter-spacing: 4px;
        line-height: 1;
        color: var(--text);
      }

      .logo span {
        color: var(--accent-push);
      }

      .date-display {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.6;
      }

      /* Day tabs */
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 28px;
      }

      .tab {
        padding: 14px 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .tab::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: currentColor;
        transform: scaleX(0);
        transition: transform 0.2s;
      }

      .tab:hover::after {
        transform: scaleX(1);
      }

      .tab.push.active {
        color: var(--accent-push);
        border-color: var(--accent-push);
        background: rgba(255, 77, 0, 0.06);
      }
      .tab.pull.active {
        color: var(--accent-pull);
        border-color: var(--accent-pull);
        background: rgba(0, 194, 255, 0.06);
      }
      .tab.legs.active {
        color: var(--accent-legs);
        border-color: var(--accent-legs);
        background: rgba(0, 232, 122, 0.06);
      }
      .tab.push.active::after {
        background: var(--accent-push);
        transform: scaleX(1);
      }
      .tab.pull.active::after {
        background: var(--accent-pull);
        transform: scaleX(1);
      }
      .tab.legs.active::after {
        background: var(--accent-legs);
        transform: scaleX(1);
      }

      .tab-sub {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 9px;
        letter-spacing: 1px;
        display: block;
        margin-top: 2px;
        opacity: 0.6;
        text-transform: uppercase;
      }

      /* Day panel */
      .day-panel {
        display: none;
      }
      .day-panel.active {
        display: block;
      }

      .day-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .day-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 36px;
        letter-spacing: 3px;
      }

      .day-title.push {
        color: var(--accent-push);
      }
      .day-title.pull {
        color: var(--accent-pull);
      }
      .day-title.legs {
        color: var(--accent-legs);
      }

      .day-muscles {
        font-size: 11px;
        color: var(--text-muted);
        font-family: "IBM Plex Mono", monospace;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Exercise card */
      .exercise-card {
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 10px;
        overflow: hidden;
        transition: border-color 0.2s;
      }

      .exercise-card.done {
        opacity: 0.5;
      }
      .exercise-card.push-card:focus-within {
        border-color: rgba(255, 77, 0, 0.3);
      }
      .exercise-card.pull-card:focus-within {
        border-color: rgba(0, 194, 255, 0.3);
      }
      .exercise-card.legs-card:focus-within {
        border-color: rgba(0, 232, 122, 0.3);
      }

      .exercise-header {
        display: flex;
        align-items: center;
        padding: 12px 14px;
        gap: 12px;
        cursor: pointer;
        user-select: none;
      }

      .exercise-check {
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--border);
        flex-shrink: 0;
        position: relative;
        cursor: pointer;
        transition: all 0.15s;
      }

      .exercise-check.checked {
        background: var(--accent-legs);
        border-color: var(--accent-legs);
      }

      .exercise-check.checked::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 11px;
        color: #000;
        font-weight: 700;
      }

      .push-card .exercise-check.checked {
        background: var(--accent-push);
        border-color: var(--accent-push);
      }
      .pull-card .exercise-check.checked {
        background: var(--accent-pull);
        border-color: var(--accent-pull);
      }

      .exercise-name {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      .exercise-meta {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .exercise-toggle {
        font-size: 10px;
        color: var(--text-muted);
        transition: transform 0.2s;
      }

      .exercise-toggle.open {
        transform: rotate(180deg);
      }

      /* Sets grid */
      .sets-area {
        display: none;
        padding: 0 14px 14px;
      }

      .sets-area.open {
        display: block;
      }

      .sets-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: grid;
        grid-template-columns: 28px 1fr 1fr 1fr;
        gap: 6px;
        padding: 0 2px;
      }

      .set-row {
        display: grid;
        grid-template-columns: 28px 1fr 1fr 1fr;
        gap: 6px;
        margin-bottom: 6px;
        align-items: center;
      }

      .set-num {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
      }

      .set-input {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        padding: 7px 10px;
        width: 100%;
        outline: none;
        transition: border-color 0.15s;
        -webkit-appearance: none;
      }

      .set-input::placeholder {
        color: var(--text-muted);
        font-size: 11px;
      }

      .push-card .set-input:focus {
        border-color: var(--accent-push);
      }
      .pull-card .set-input:focus {
        border-color: var(--accent-pull);
      }
      .legs-card .set-input:focus {
        border-color: var(--accent-legs);
      }

      .set-input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
      }

      .notes-input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-top: none;
        color: var(--text-dim);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
        padding: 8px 10px;
        outline: none;
        resize: none;
        min-height: 36px;
        transition: border-color 0.15s;
      }

      .notes-input::placeholder {
        color: var(--text-muted);
      }
      .push-card .notes-input:focus {
        border-color: var(--accent-push);
      }
      .pull-card .notes-input:focus {
        border-color: var(--accent-pull);
      }
      .legs-card .notes-input:focus {
        border-color: var(--accent-legs);
      }

      /* Progress bar */
      .progress-wrap {
        margin-bottom: 20px;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .progress-bar {
        height: 2px;
        background: var(--border);
        position: relative;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        transition: width 0.3s ease;
      }

      .push .progress-fill {
        background: var(--accent-push);
      }
      .pull .progress-fill {
        background: var(--accent-pull);
      }
      .legs .progress-fill {
        background: var(--accent-legs);
      }

      /* Reset button */
      .reset-btn {
        display: block;
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s;
      }

      .reset-btn:hover {
        border-color: #444;
        color: var(--text);
      }

      /* Save indicator */
      .save-indicator {
        position: fixed;
        bottom: 16px;
        right: 16px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .save-indicator.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">PPL<span>.</span></div>
      <div class="date-display" id="dateDisplay"></div>
    </header>

    <div class="tabs">
      <div class="tab push active" onclick="switchDay('push')">
        PUSH
        <span class="tab-sub">Chest · Shoulders · Triceps</span>
      </div>
      <div class="tab pull" onclick="switchDay('pull')">
        PULL
        <span class="tab-sub">Back · Biceps</span>
      </div>
      <div class="tab legs" onclick="switchDay('legs')">
        LEGS
        <span class="tab-sub">Legs · Abs</span>
      </div>
    </div>

    <!-- PUSH -->
    <div class="day-panel active" id="panel-push">
      <div class="day-header">
        <div class="day-title push">PUSH</div>
        <div class="day-muscles">Chest / Shoulders / Triceps</div>
      </div>
      <div class="progress-wrap push">
        <div class="progress-info">
          <span>PROGRESS</span>
          <span id="push-progress-text">0 / 9</span>
        </div>
        <div class="progress-bar">
          <div
            class="progress-fill"
            id="push-progress-fill"
            style="width: 0%"
          ></div>
        </div>
      </div>
      <div id="exercises-push"></div>
      <button class="reset-btn" onclick="resetDay('push')">↺ Reset day</button>
    </div>

    <!-- PULL -->
    <div class="day-panel" id="panel-pull">
      <div class="day-header">
        <div class="day-title pull">PULL</div>
        <div class="day-muscles">Back / Biceps</div>
      </div>
      <div class="progress-wrap pull">
        <div class="progress-info">
          <span>PROGRESS</span>
          <span id="pull-progress-text">0 / 8</span>
        </div>
        <div class="progress-bar">
          <div
            class="progress-fill"
            id="pull-progress-fill"
            style="width: 0%"
          ></div>
        </div>
      </div>
      <div id="exercises-pull"></div>
      <button class="reset-btn" onclick="resetDay('pull')">↺ Reset day</button>
    </div>

    <!-- LEGS -->
    <div class="day-panel" id="panel-legs">
      <div class="day-header">
        <div class="day-title legs">LEGS</div>
        <div class="day-muscles">Legs / Abs</div>
      </div>
      <div class="progress-wrap legs">
        <div class="progress-info">
          <span>PROGRESS</span>
          <span id="legs-progress-text">0 / 6</span>
        </div>
        <div class="progress-bar">
          <div
            class="progress-fill"
            id="legs-progress-fill"
            style="width: 0%"
          ></div>
        </div>
      </div>
      <div id="exercises-legs"></div>
      <button class="reset-btn" onclick="resetDay('legs')">↺ Reset day</button>
    </div>

    <div class="save-indicator" id="saveIndicator">SAVED</div>

    <script>
      const PLAN = {
        push: [
          { name: "Barbell Bench Press", sets: 4, reps: "8-10" },
          { name: "Dumbbell Bench Press", sets: 3, reps: "10-12" },
          { name: "Dips", sets: 3, reps: "8-12" },
          { name: "Front Raise", sets: 3, reps: "12-15" },
          { name: "Machine Shoulder Raise", sets: 3, reps: "12-15" },
          { name: "Dumbbell Lateral Raise", sets: 3, reps: "12-15" },
          { name: "Incline Rear Delt Raise", sets: 3, reps: "12-15" },
          { name: "Skull Crusher", sets: 3, reps: "10-12" },
          { name: "Overhead Triceps Extension", sets: 3, reps: "10-12" },
        ],
        pull: [
          { name: "Pull-ups", sets: 4, reps: "8-12" },
          { name: "Barbell Row", sets: 4, reps: "8-10" },
          { name: "Cable Row", sets: 4, reps: "8-12" },
          { name: "Dumbbell Row", sets: 3, reps: "10-12" },
          { name: "Machine Row", sets: 3, reps: "10-12" },
          { name: "Hyperextensions", sets: 3, reps: "12-15" },
          { name: "Barbell Curl", sets: 3, reps: "10-12" },
          { name: "Dumbbell Curl", sets: 3, reps: "10-12" },
        ],
        legs: [
          { name: "Squats", sets: 4, reps: "8-10" },
          { name: "Leg press", sets: 4, reps: "10-12" },
          { name: "Leg Extension", sets: 3, reps: "12-15" },
          { name: "Calf Press", sets: 4, reps: "15-20" },
          { name: "Hyperextensions", sets: 3, reps: "12-15" },
          { name: "Hanging Crunches", sets: 3, reps: "12-15" },
        ],
      };

      let state = JSON.parse(localStorage.getItem("ppl_state") || "null") || {
        push: {},
        pull: {},
        legs: {},
      };

      function saveState() {
        localStorage.setItem("ppl_state", JSON.stringify(state));
        const ind = document.getElementById("saveIndicator");
        ind.classList.add("show");
        setTimeout(() => ind.classList.remove("show"), 1500);
      }

      function getExKey(day, idx, set, field) {
        return `${day}_${idx}_${field}`;
      }

      function buildExercises(day) {
        const container = document.getElementById(`exercises-${day}`);
        container.innerHTML = "";

        PLAN[day].forEach((ex, idx) => {
          const key = `${day}_${idx}`;
          const exState = state[day][key] || {};
          const isDone = exState.done || false;

          const card = document.createElement("div");
          card.className = `exercise-card ${day}-card${isDone ? " done" : ""}`;
          card.id = `card-${key}`;

          // Sets rows HTML
          let setsHTML = `<div class="sets-label">
      <span>#</span><span>KG</span><span>REPS</span><span>NOTE</span>
    </div>`;

          for (let s = 1; s <= ex.sets; s++) {
            const kg = exState[`s${s}_kg`] || "";
            const reps = exState[`s${s}_reps`] || "";
            const done = exState[`s${s}_done`] || "";
            setsHTML += `
        <div class="set-row">
          <div class="set-num">${s}</div>
          <input class="set-input" type="number" placeholder="kg" value="${kg}"
            oninput="updateSet('${day}',${idx},${s},'kg',this.value)">
          <input class="set-input" type="number" placeholder="${ex.reps}" value="${reps}"
            oninput="updateSet('${day}',${idx},${s},'reps',this.value)">
          <input class="set-input" type="text" placeholder="note" value="${done}"
            oninput="updateSet('${day}',${idx},${s},'done',this.value)">
        </div>`;
          }

          const notes = exState.notes || "";
          setsHTML += `<textarea class="notes-input" placeholder="Exercise notes..."
      oninput="updateNotes('${day}',${idx},this.value)">${notes}</textarea>`;

          card.innerHTML = `
      <div class="exercise-header" onclick="toggleSets('${key}')">
        <div class="exercise-check${isDone ? " checked" : ""}" id="check-${key}"
          onclick="event.stopPropagation(); toggleDone('${day}',${idx})"></div>
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-meta">${ex.sets}×${ex.reps}</div>
        <div class="exercise-toggle" id="toggle-${key}">▼</div>
      </div>
      <div class="sets-area" id="sets-${key}">
        ${setsHTML}
      </div>`;

          container.appendChild(card);
        });

        updateProgress(day);
      }

      function toggleSets(key) {
        const area = document.getElementById(`sets-${key}`);
        const toggle = document.getElementById(`toggle-${key}`);
        area.classList.toggle("open");
        toggle.classList.toggle("open");
      }

      function toggleDone(day, idx) {
        const key = `${day}_${idx}`;
        if (!state[day][key]) state[day][key] = {};
        state[day][key].done = !state[day][key].done;
        const card = document.getElementById(`card-${key}`);
        const check = document.getElementById(`check-${key}`);
        card.classList.toggle("done", state[day][key].done);
        check.classList.toggle("checked", state[day][key].done);
        updateProgress(day);
        saveState();
      }

      function updateSet(day, idx, set, field, value) {
        const key = `${day}_${idx}`;
        if (!state[day][key]) state[day][key] = {};
        state[day][key][`s${set}_${field}`] = value;
        saveState();
      }

      function updateNotes(day, idx, value) {
        const key = `${day}_${idx}`;
        if (!state[day][key]) state[day][key] = {};
        state[day][key].notes = value;
        saveState();
      }

      function updateProgress(day) {
        const total = PLAN[day].length;
        let done = 0;
        PLAN[day].forEach((_, idx) => {
          const key = `${day}_${idx}`;
          if (state[day][key] && state[day][key].done) done++;
        });
        const pct = Math.round((done / total) * 100);
        document.getElementById(`${day}-progress-fill`).style.width = pct + "%";
        document.getElementById(`${day}-progress-text`).textContent =
          `${done} / ${total}`;
      }

      function resetDay(day) {
        if (!confirm(`Reset all data for day ${day.toUpperCase()}?`)) return;
        state[day] = {};
        saveState();
        buildExercises(day);
      }

      function switchDay(day) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".day-panel")
          .forEach((p) => p.classList.remove("active"));
        document.querySelector(`.tab.${day}`).classList.add("active");
        document.getElementById(`panel-${day}`).classList.add("active");
      }

      // Date display
      function updateDate() {
        const now = new Date();
        const days = [
          "SUNDAY",
          "MONDAY",
          "TUESDAY",
          "WEDNESDAY",
          "THURSDAY",
          "FRIDAY",
          "SATURDAY",
        ];
        const months = [
          "JAN",
          "FEB",
          "MAR",
          "APR",
          "MAY",
          "JUN",
          "JUL",
          "AUG",
          "SEP",
          "OCT",
          "NOV",
          "DEC",
        ];
        document.getElementById("dateDisplay").innerHTML =
          `${days[now.getDay()]}<br>${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
      }

      // Init
      updateDate();
      buildExercises("push");
      buildExercises("pull");
      buildExercises("legs");
    </script>
  </body>
</html>
